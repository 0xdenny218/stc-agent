name: release
# tag 推送（v*）触发：交叉编译多平台二进制，打包并附到对应 release。
# release 已存在（手动双语 notes 的发布流程）则只上传工件，否则按
# tag 注记创建。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"
            ext=""; archive="tar.gz"
            if [ "$os" = "windows" ]; then ext=".exe"; archive="zip"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/stc-agent$ext" ./cmd/stc-agent
            case "$archive" in
              zip) (cd dist && zip -q "stc-agent_${tag}_${os}_${arch}.zip" "stc-agent$ext" && rm "stc-agent$ext") ;;
              *)   (cd dist && tar -czf "stc-agent_${tag}_${os}_${arch}.tar.gz" "stc-agent$ext" && rm "stc-agent$ext") ;;
            esac
          done
          (cd dist && sha256sum stc-agent_* > checksums.txt)
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
          fi
